name: Phase 1 SUMO smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUMO_HOME: /usr/share/sumo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulator and Python interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sumo sumo-tools xvfb xauth
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check versions
        run: xvfb-run -a python scripts/check_environment.py
      - name: Run headless and graphical TraCI simulations
        run: |
          python scripts/demo.py
          xvfb-run -a python scripts/demo.py --gui --output results/demo-gui.csv
          diff results/demo.csv results/demo-gui.csv
      - name: Exercise Gymnasium reset and step
        run: python scripts/smoke_rl.py
      - name: Rebuild NCHU demand and exercise the real-geometry intersection
        run: |
          python scripts/nchu_demand.py results/nchu-inputs
          for scenario in offpeak morning evening; do
            cmp data/nchu/${scenario}_synthetic.csv results/nchu-inputs/${scenario}_synthetic.csv
            python scripts/nchu_scenario.py data/nchu/${scenario}_synthetic.csv --out results/nchu/$scenario
          done
          xvfb-run -a python scripts/nchu_scenario.py data/nchu/morning_synthetic.csv --out results/nchu/gui --gui
          diff results/nchu/morning/summary.json results/nchu/gui/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: nchu-gate-scenarios
          path: |
            results/nchu/*/gate.*
            results/nchu/*/summary.json
            results/nchu/*/statistics.xml
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-traces
          path: results/*.csv
